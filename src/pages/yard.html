<section class="block" aria-label="마당과 주차 안내">
  <div class="prose">
    <p>마당에는 꽃과 파라솔, 야외 테이블이 있습니다. 영업용 싱크대가 있어 채소나 큰 그릇을 밖에서 씻을 수 있고, 텃밭 채소는 상황에 따라 직접 따 드실 수 있어요.</p>
    <p>저녁에는 불멍 화로(장작 3kg, 1만 원)와 바비큐 그릴(숯 포함, 1만 5천 원)을 빌려 쓸 수 있습니다.</p>
    <p>담벼락 쪽에 2대, 마당 안쪽에도 주차할 수 있습니다. 대문 안쪽에 전기차 충전기가 있어 밤새 충전해 두면 됩니다.</p>
