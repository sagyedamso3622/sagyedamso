<section class="block" aria-label="사계담소가 있는 곳">
  <div class="prose">
    <p>사계담소는 산방산 자락에 있는 제주 돌담집입니다. 주인이 직접 운영하며, 본채에는 주인이 지내고 손님은 바깥채를 독채로 씁니다.</p>
    <p>대문 안쪽으로 넓은 자갈 마당이 있고, 걸어서 15분이면 사계바닷가에 닿습니다. 일정 없이 하루 종일 집과 마당에서 쉬어도 좋습니다.</p>
  </div>
  <div class="pair">
    <figure>

      <figcaption>대문과 문패</figcaption>
    </figure>
    <figure>

      <figcaption>돌담 안쪽 마당과 바깥채</figcaption>
    </figure>

    <h2 class="h3">가까운 곳까지 걸리는 시간</h2>

      <li><span>형제해안로, 사계해안, 용머리해안</span><span>차로 3분</span></li>
      <li><span>송악산</span><span>차로 5분</span></li>
